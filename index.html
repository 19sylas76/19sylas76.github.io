<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordVault | Download Beta</title>
    <style>
        /* Reset and clean up all default page gaps */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
        }

        /* Container that scales perfectly on any browser window */
        .mockup-container {
            position: relative;
            width: 100%;
            max-width: 1000px; /* Limits scaling so the text stays perfectly readable */
        }

        .mockup-image {
            display: block;
            width: 100%;
            height: auto;
            user-select: none;
        }

        /* The precise clickable box mapped directly over the big blue hero button */
        .download-hotspot {
            position: absolute;
            top: 25.1%;
            left: 3.9%;
            width: 11.2%;
            height: 2.8%;
            
            background: rgba(0, 0, 0, 0); /* Invisible */
            border-radius: 4px;
            cursor: pointer;
        }

        /* Subtle indicator so your friends know it is a real button when hovered */
        .download-hotspot:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="mockup-container">
        <!-- Safely pulls your crisp, flat image asset directly from your GitHub directory -->
        <img src="mockup.png" alt="WordVault Product Presentation Layout" class="mockup-image">

        <!-- THE 1 WORKING DOWNLOAD LINK -->
        <!-- Replace the '#' sign below with your real Wormhole, GoFile, or Drive link -->
        <a href="#" class="download-hotspot" title="Download WordVault Beta"></a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordVault - Type it once. Never type it again.</title>
    <style>
        /* --- DESIGN SYSTEM & BRAND COLORS --- */
        :root {
            --bg-dark: #0a192f;
            --bg-card: #123B66;
            --border-cyan: #00D9FF;
            --text-white: #ffffff;
            --text-muted: #8892b0;
            --accent-green: #008F5F;
            --accent-green-hover: #00FFB7;
            --btn-blue: #005F8F;
            --btn-blue-hover: #00D9FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #334155;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- NAVIGATION BAR --- */
        header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            color: var(--bg-dark);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #64748b;
            font-weight: 500;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: var(--btn-blue-hover);
        }

        .btn-nav-download {
            background-color: var(--bg-dark);
            color: white !important;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px !important;
        }

        /* --- HERO SECTION --- */
        .hero {
            background: linear-gradient(180deg, #f1f5f9 0%, #ffffff 100%);
            padding: 80px 0;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: #e2e8f0;
            color: var(--btn-blue);
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            color: var(--bg-dark);
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .hero h1 span {
            color: var(--btn-blue);
        }

        .hero p {
            font-size: 18px;
            color: #64748b;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .btn-primary {
            background-color: var(--btn-blue);
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            border: 1px solid var(--border-cyan);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-primary:hover {
            background-color: var(--btn-blue-hover);
            color: #0a192f;
        }

        .btn-secondary {
            background-color: white;
            color: #334155;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            border: 1px solid #cbd5e1;
        }

        .hero-meta {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 50px;
        }

        .hero-image-container img {
            width: 100%;
            max-width: 850px;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }

        /* --- VALUE PROPOSITION GRID --- */
        .section-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--bg-dark);
            margin: 80px 0 50px 0;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            margin-bottom: 80px;
        }

        .feature-card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .feature-card h3 {
            font-size: 15px;
            color: var(--bg-dark);
            margin-bottom: 8px;
        }

        .feature-card p {
            font-size: 13px;
            color: #64748b;
        }

        .tag-soon {
            background: #fee2e2;
            color: #ef4444;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 5px;
            vertical-align: middle;
        }

        /* --- HOW IT WORKS SPLIT LAYOUT --- */
        .how-it-works {
            background: #f1f5f9;
            padding: 80px 0;
        }

        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .steps-list {
            list-style: none;
        }

        .step-item {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
        }

        .step-number {
            background: var(--btn-blue);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .step-text h3 {
            font-size: 18px;
            color: var(--bg-dark);
            margin-bottom: 4px;
        }

        .step-text p {
            font-size: 14px;
            color: #64748b;
        }

        .images-showcase {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .img-manager {
            width: 60%;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .img-dropdown {
            width: 35%;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        /* --- AUDIENCE & SECURITY GRID --- */
        .double-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
            padding: 80px 0;
        }

        .audience-pane h2, .security-pane h2 {
            font-size: 24px;
            color: var(--bg-dark);
            margin-bottom: 12px;
        }

        .audience-pane p, .security-pane p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
        }

        .audience-subgrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .audience-item h4 {
            font-size: 14px;
            color: var(--bg-dark);
            margin-bottom: 4px;
        }

        .audience-item p {
            font-size: 13px;
            color: #64748b;
        }

        .security-box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 30px;
        }

        .security-list {
            list-style: none;
            margin-top: 20px;
        }

        .security-list li {
            font-size: 14px;
            margin-bottom: 10px;
            color: #334155;
        }

        /* --- CLOSING CTA BANNER --- */
        .cta-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            text-align: center;
            padding: 60px 20px;
            border-radius: 12px;
            margin-bottom: 80px;
        }

        .cta-banner h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .cta-banner p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* --- FOOTER --- */
        footer {
            background: #0f172a;
            color: #94a3b8;
            padding: 60px 0 30px 0;
            font-size: 13px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            border-bottom: 1px solid #334155;
            padding-bottom: 40px;
            margin-bottom: 30px;
        }

        .footer-col h4 {
            color: white;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .footer-col p {
            line-height: 1.8;
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col ul li {
            margin-bottom: 8px;
        }

        .footer-col ul a {
            color: #94a3b8;
            text-decoration: none;
        }

        .footer-col ul a:hover {
            color: white;
        }

        .copyright {
            text-align: center;
            font-size: 11px;

color: #64748b;
}
/* --- RESPONSIVE MOBILE SCALING --- */
@media (max-width: 768px) {
.hero h1 { font-size: 32px; }
.split-layout, .double-grid { grid-template-columns: 1fr; gap: 30px; }
.audience-subgrid { grid-template-columns: 1fr; }
.images-showcase { flex-direction: column; }
.img-manager, .img-dropdown { width: 100%; }
.nav-links li:not(:last-child) { display: none; }
}
